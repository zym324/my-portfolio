<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人展示网站 | Portfolio</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="#home" class="nav-logo">
                <span class="logo-icon">◆</span> Portfolio
            </a>
            <ul class="nav-menu" id="nav-menu">
                <li><a href="#home" class="nav-link">首页</a></li>
                <li><a href="#about" class="nav-link">关于我</a></li>
                <li><a href="#skills" class="nav-link">技能</a></li>
                <li><a href="#projects" class="nav-link">项目</a></li>
                <li><a href="#blog" class="nav-link">博客</a></li>
                <li><a href="#contact" class="nav-link">联系</a></li>
            </ul>
            <div class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- Hero 区域 -->
    <section id="home" class="hero">
        <div class="hero-content">
            <div class="hero-avatar">
                <div class="avatar-ring"></div>
                <img id="heroAvatar" src="" alt="头像" class="avatar-img">
            </div>
            <p class="hero-greeting" id="heroGreeting">你好，我是</p>
            <h1 class="hero-title" id="heroName">加载中…</h1>
            <p class="hero-subtitle" id="heroSubtitle"></p>
            <p class="hero-description" id="heroDescription"></p>
            <div class="hero-buttons">
                <a href="#projects" class="btn btn-primary">查看项目</a>
                <a href="#contact" class="btn btn-secondary">联系我</a>
            </div>
            <div class="hero-socials" id="heroSocials"></div>
        </div>
        <div class="scroll-indicator">
            <div class="mouse">
                <div class="wheel"></div>
            </div>
            <span>向下滚动</span>
        </div>
    </section>

    <!-- 关于我 -->
    <section id="about" class="section about">
        <div class="container">
            <h2 class="section-title">关于我</h2>
            <div class="about-grid">
                <div class="about-text">
                    <div id="aboutText"></div>
                    <div class="about-stats" id="aboutStats"></div>
                </div>
                <div class="about-image">
                    <img id="aboutImage" src="" alt="工作照">
                </div>
            </div>
        </div>
    </section>

    <!-- 技能展示 -->
    <section id="skills" class="section skills">
        <div class="container">
            <h2 class="section-title">技能展示</h2>
            <div id="skillsContainer"></div>
        </div>
    </section>

    <!-- 项目展示 -->
    <section id="projects" class="section projects">
        <div class="container">
            <h2 class="section-title">项目展示</h2>
            <div class="projects-grid" id="projectsContainer"></div>
        </div>
    </section>

    <!-- 博客 -->
    <section id="blog" class="section blog">
        <div class="container">
            <h2 class="section-title">最新博客</h2>
            <div class="blog-grid" id="blogContainer"></div>
        </div>
    </section>

    <!-- 联系我 -->
    <section id="contact" class="section contact">
        <div class="container">
            <h2 class="section-title">联系我</h2>
            <div class="contact-grid">
                <div class="contact-info" id="contactInfo"></div>
                <form class="contact-form" id="contact-form">
                    <div class="form-group">
                        <input type="text" id="name" name="name" placeholder="你的名字" required>
                    </div>
                    <div class="form-group">
                        <input type="email" id="email" name="email" placeholder="你的邮箱" required>
                    </div>
                    <div class="form-group">
                        <textarea id="message" name="message" rows="5" placeholder="想对我说什么？" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary btn-full">发送消息</button>
                </form>
            </div>
        </div>
    </section>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="container">
            <p>&copy; <span id="footerYear">2026</span> <span id="footerName">Portfolio</span>. All rights reserved.</p>
            <div class="footer-links">
                <a href="#home">首页</a>
                <a href="#about">关于</a>
                <a href="#projects">项目</a>
                <a href="#contact">联系</a>
            </div>
        </div>
    </footer>

    <!-- 返回顶部 -->
    <button id="back-to-top" class="back-to-top" aria-label="返回顶部">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 15l-6-6-6 6"/></svg>
    </button>

    <script src="script.js"></script>
</body>
</html>
