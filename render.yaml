services:
  - type: web
    name: portfolio-backend
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: node server.js
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: GH_TOKEN
        sync: false
      - key: GH_REPO
        value: zym324/my-portfolio
      - key: GH_PATH
        value: content.json
      - key: GH_BRANCH
        value: main
